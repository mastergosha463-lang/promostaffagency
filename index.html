    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (() => {
        const resetKey = "cloudstaff-cache-reset-v2";
        const reloadKey = "cloudstaff-cache-reloaded";

        const clearAppCaches = async () => {
          try {
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }

            if ("caches" in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
            }
          } catch (error) {
            console.warn("Cache reset skipped", error);
          }
        };

        if (localStorage.getItem(resetKey) !== "done") {
          localStorage.setItem(resetKey, "done");
          clearAppCaches();
        }

        // Pre-boot error buffer — drained by errorReporter once the bundle loads.
        // ALSO sent directly via sendBeacon so we capture failures even when bundle never executes.
        window.__errorBuffer = window.__errorBuffer || [];
        var SB_URL = "https://gtacfqxkcmexpmzwbkue.supabase.co";
        var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0YWNmcXhrY21leHBtendia3VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3OTAwMzYsImV4cCI6MjA4MzM2NjAzNn0.DqTMgURvRDX5hQSC_YMSDaNePDKQLwnDoAdz6TMavsE";
        var sentCount = 0;
        var directSend = function (entry) {
          if (sentCount >= 10) return;
          sentCount++;
          try {
            var payload = JSON.stringify({
              kind: entry.kind || "preboot",
              message: (entry.message || "").slice(0, 500),
              source: entry.source || null,
              lineno: entry.lineno || null,
              colno: entry.colno || null,
              stack: (entry.stack || "").slice(0, 2000) || null,
              page_path: location.pathname + location.search,
              user_agent: navigator.userAgent,
              url: location.href,
              extra: Object.assign({ phase: "pre-boot", online: navigator.onLine }, entry.extra || {})
            });
            var url = SB_URL + "/rest/v1/client_errors";
            var headers = { type: "application/json" };
            var blob = new Blob([payload], headers);
            // sendBeacon doesn't allow custom headers, so use fetch with keepalive as primary
            if (window.fetch) {
              fetch(url, {
                method: "POST",
                keepalive: true,
                headers: {
                  "Content-Type": "application/json",
                  "apikey": SB_KEY,
                  "Authorization": "Bearer " + SB_KEY,
                  "Prefer": "return=minimal"
                },
                body: payload
              }).catch(function () {});
            }
          } catch (e) {}
        };
        var bufferPush = function (entry) {
          try { window.__errorBuffer.push(entry); } catch (e) {}
          directSend(entry);
        };

        // Boot timeout detector — if React never mounts, report it.
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0) {
            directSend({
              kind: "boot_timeout",
              message: "React did not mount within 12s",
              extra: {
                online: navigator.onLine,
                cookieEnabled: navigator.cookieEnabled,
                connection: (navigator.connection && {
                  effectiveType: navigator.connection.effectiveType,
                  downlink: navigator.connection.downlink,
                  rtt: navigator.connection.rtt,
                  saveData: navigator.connection.saveData
                }) || null,
                viewport: window.innerWidth + "x" + window.innerHeight,
                bundleScripts: Array.prototype.slice.call(document.scripts).map(function (s) { return s.src; }).filter(Boolean)
              }
            });
          }
        }, 12000);

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          bufferPush({
            kind: "unhandled_rejection",
            message: typeof reason === "string" ? reason : (reason && reason.message) || "Unhandled rejection",
            stack: reason && reason.stack ? reason.stack : null
          });
        });

        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            const tagName = target && target.tagName;
            const isCriticalAsset = tagName === "SCRIPT" || tagName === "LINK";

            if (isCriticalAsset) {
              bufferPush({
                kind: "asset_error",
                message: "Failed to load " + tagName + " (pre-boot)",
                source: (target.src || target.href || ""),
                extra: { tag: tagName, phase: "pre-boot" }
              });
            } else if (event && event.message) {
              bufferPush({
                kind: "runtime_error",
                message: event.message,
                source: event.filename || null,
                lineno: event.lineno || null,
                colno: event.colno || null,
                stack: event.error && event.error.stack ? event.error.stack : null,
                extra: { phase: "pre-boot" }
              });
            }

            if (!isCriticalAsset || sessionStorage.getItem(reloadKey) === "done") return;

            sessionStorage.setItem(reloadKey, "done");
            clearAppCaches().finally(() => {
              const url = new URL(window.location.href);
              url.searchParams.set("cache_bust", Date.now().toString());
              window.location.replace(url.toString());
            });
          },
          true
        );
      })();
    </script>

  <body style="background:#000;color:#fff;margin:0;font-family:Inter,system-ui,sans-serif;">
    <div id="root"></div>
    <div id="boot-fallback" style="position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;text-align:center;padding:24px;z-index:-1;pointer-events:none;">
      <div style="width:48px;height:48px;border:3px solid rgba(255,255,255,0.15);border-top-color:#ff1f9c;border-radius:50%;animation:cs-spin 1s linear infinite;"></div>
      <p style="margin-top:20px;font-size:15px;opacity:0.8;">Загружаем CLOUDSTAFF…</p>
      <p id="boot-hint" style="margin-top:8px;font-size:13px;opacity:0;transition:opacity .3s;max-width:320px;line-height:1.4;">
        Если страница не загрузилась — нажмите кнопку ниже, чтобы сбросить кэш.
      </p>
      <button id="boot-reload" style="margin-top:16px;opacity:0;transition:opacity .3s;background:#ff1f9c;color:#fff;border:none;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">
        Обновить и сбросить кэш
      </button>
      <noscript>
        <p style="margin-top:24px;color:#ff1f9c;">Включите JavaScript в браузере, чтобы открыть сайт.</p>
      </noscript>
    </div>
    <style>@keyframes cs-spin{to{transform:rotate(360deg)}}</style>
    <script>
      (function () {
        var hint = document.getElementById('boot-hint');
        var btn = document.getElementById('boot-reload');
        var fallback = document.getElementById('boot-fallback');
        var root = document.getElementById('root');
        var mounted = false;

        // Only show the fallback if React hasn't mounted within 1.5s.
        var showTimer = setTimeout(function () {
          if (mounted || !fallback) return;
          fallback.style.display = 'flex';
          fallback.style.zIndex = '9999';
          fallback.style.pointerEvents = 'auto';
        }, 1500);

        var hintTimer = setTimeout(function () {
          if (mounted) return;
          if (hint) hint.style.opacity = '1';
          if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        }, 7000);

        function hide() {
          if (mounted) return;
          mounted = true;
          clearTimeout(showTimer);
          clearTimeout(hintTimer);
          if (fallback && fallback.parentNode) fallback.parentNode.removeChild(fallback);
        }

        // Auto-hide as soon as React mounts anything into #root.
        if (root && 'MutationObserver' in window) {
          var mo = new MutationObserver(function () {
            if (root.childElementCount > 0) { mo.disconnect(); hide(); }
          });
          mo.observe(root, { childList: true });
        }
        window.__hideBootFallback = hide;
        if (btn) btn.addEventListener('click', function () {
          try {
            localStorage.clear();
            sessionStorage.clear();
            if ('caches' in window) caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
            if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); });
          } catch (e) {}
          var u = new URL(location.href);
          u.searchParams.set('cache_bust', Date.now().toString());
          location.replace(u.toString());
        });
      })();
      })();
    </script>
